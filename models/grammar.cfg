# Ký hiệu bắt đầu
S -> Q_COURSE_INFO | Q_SCHEDULE | Q_TOPIC | Q_ASSIGNMENT | Q_DEADLINE | Q_RESOURCE | Q_RULE | Q_LO | Q_CONTEXT

# 1. HỎI THÔNG TIN MÔN HỌC (GET_COURSE_INFO)
Q_COURSE_INFO -> 'môn' COURSE_NAME 'có' HOW_MANY COURSE_METRIC \
                | COURSE_NAME 'có' HOW_MANY COURSE_METRIC \
                | 'môn_học' 'có' HOW_MANY COURSE_METRIC \
                | 'thời_lượng' 'của' 'môn_học' 'là' 'bao_nhiêu' \
                | 'môn_học' 'gồm' 'những' 'phần' 'nào' \
                | 'môn_học' 'gồm' HOW_MANY 'phần' 'chính' \
                | COURSE_NAME 'có' 'những' 'phần' 'chính' 'nào' \
                | 'cách' 'đánh_giá' 'môn_học' 'như' 'thế_nào' \
                | 'tỷ_lệ' 'điểm' 'của' 'môn_học' 'là' 'gì' \
                | 'cách' 'tính' 'điểm' 'môn' COURSE_NAME 'là' 'gì' \
                | EXAM HOW_MANY 'phút' \
                | EXAM 'kéo_dài' 'bao_lâu' \
                | 'thi' EXAM HOW_MANY 'phút' \
                | 'thi' EXAM 'kéo_dài' 'bao_lâu' \
                | 'hình_thức' 'thi' EXAM 'là' 'gì' \
                | 'hình_thức' 'thi' 'của' 'môn_học' 'là' 'gì' \
                | 'khoa' 'nào' 'phụ_trách' 'môn' COURSE_NAME \
                | 'môn' COURSE_NAME 'học' 'ở' 'học_kỳ' 'nào' \
                | 'mục_tiêu' 'của' 'môn_học' 'là' 'gì' \
                | 'mô_tả' 'của' 'môn_học' 'là' 'gì' \
                | 'giảng_viên' 'phụ_trách' 'môn' COURSE_NAME 'là' 'ai' \
                | 'ai' 'dạy' 'môn' COURSE_NAME \
                | 'phòng_học' 'của' 'môn' COURSE_NAME 'ở' 'đâu'

# 2. HỎI LỊCH HỌC (GET_SCHEDULE)
Q_SCHEDULE -> 'tuần' WEEK_NUM 'học' 'gì' \
            | 'tuần' WEEK_NUM 'học' 'những' 'gì' \
            | 'tuần' WEEK_NUM 'học' 'những' 'nội_dung' 'gì' \
            | 'tuần' WEEK_NUM 'học' 'chương' 'nào' \
            | 'tuần' WEEK_NUM 'học' 'chương' 'nào' 'và' 'nội_dung' 'gì' \
            | 'nội_dung' 'tuần' WEEK_NUM 'là' 'gì' \
            | 'chương' CH_NUM 'học' 'vào' 'tuần' 'nào' \
            | 'chương' CH_NUM 'được' 'học' 'ở' 'tuần' 'nào' \
            | 'khi' 'nào' 'học' 'chương' CH_NUM \
            | TOPIC_ENTITY 'học' 'vào' 'tuần' 'nào' \
            | 'phần' TOPIC_ENTITY 'và' TOPIC_ENTITY 'nằm' 'ở' 'tuần' 'nào' \
            | 'có' HOW_MANY 'tuần' \
            | 'môn_học' 'có' HOW_MANY 'tuần' \
            | 'môn' COURSE_NAME 'có' HOW_MANY 'tuần' \
            | 'lịch_học' 'của' 'môn_học' 'như' 'thế_nào'

# 3. HỎI CHỦ ĐỀ / BÀI GIẢNG (GET_TOPIC)
Q_TOPIC -> 'chương' 'nào' TOPIC_VERB 'về' TOPIC_ENTITY \
        | 'chương' 'nào' TOPIC_VERB 'về' TOPIC_ENTITY 'và' TOPIC_ENTITY \
        | TOPIC_ENTITY 'được' 'học' 'ở' 'đâu' \
        | TOPIC_ENTITY 'nằm' 'ở' 'chương' 'nào' \
        | 'chương' CH_NUM 'nói' 'về' 'gì' \
        | 'chương' CH_NUM 'nói' 'về' 'nội_dung' 'gì' \
        | 'chương' CH_NUM 'học' 'về' 'gì' \
        | 'nội_dung' 'của' 'chương' CH_NUM 'là' 'gì' \
        | 'chương' CH_NUM 'có' 'những' 'phương_pháp' 'gì' \
        | 'chương' CH_NUM 'có' 'những' 'nội_dung' 'gì' \
        | 'chương' CH_NUM 'gồm' 'những' 'chủ_đề' 'nào' \
        | 'chương' CH_NUM 'có' 'liên_quan' 'đến' TOPIC_ENTITY 'không' \
        | 'chương' CH_NUM 'có' 'đề_cập' 'đến' TOPIC_ENTITY 'không' \
        | 'chương' CH_NUM 'có' TOPIC_ENTITY 'không' \
        | 'có' HOW_MANY 'chương' \
        | 'môn_học' 'có' HOW_MANY 'chương' \
        | 'môn' COURSE_NAME 'có' HOW_MANY 'chương' \
        | COURSE_NAME 'có' HOW_MANY 'chương' \
        | 'môn_học' 'gồm' 'những' 'chương' 'nào'

# 4. HỎI BÀI TẬP VÀ DEADLINE (GET_ASSIGNMENT / GET_DEADLINE)
Q_DEADLINE -> 'deadline' 'của' 'bài_tập_lớn' 'là' 'khi' 'nào' \
            | 'deadline' 'bài_tập_lớn' 'là' 'khi' 'nào' \
            | 'bài_tập_lớn' 'nộp' 'khi' 'nào' \
            | 'hạn_nộp' 'bài_tập_lớn' 'là' 'khi' 'nào' \
            | 'các' 'mốc' 'của' 'bài_tập_lớn' 'là' 'khi' 'nào'

Q_ASSIGNMENT -> 'bài_tập_lớn' 'yêu_cầu' 'xây_dựng' 'những' 'gì' \
            | 'bài_tập_lớn' 'có' 'những' 'yêu_cầu' 'gì' \
            | 'bài_tập_lớn' 'gồm' HOW_MANY 'phần' \
            | 'tôi' 'cần' 'hoàn_thành' 'những' 'bài_tập' 'nào' \
            | 'phần' PART_NUM 'của' 'bài_tập_lớn' 'là' 'gì' \
            | 'phần' PART_NUM 'của' 'bài_tập_lớn' 'yêu_cầu' 'gì' \
            | 'phần' PART_NUM 'cần' 'xuất' 'file' 'gì' \
            | 'bài_tập_lớn' 'có' 'phần' ASSIGN_PART 'không' \
            | 'bài_tập_lớn' 'phần' PART_NUM 'có' 'yêu_cầu' 'xây_dựng' ASSIGN_PART 'không'

# 5. HỎI QUY ĐỊNH & TÀI LIỆU (GET_RULE / GET_RESOURCE)
Q_RULE -> 'có' 'được' 'dùng' RULE_TERM 'không' \
        | 'bài_tập_lớn' 'có' 'được' 'dùng' RULE_TERM 'không' \
        | 'quy_định' 'về' 'sử_dụng' AI_TERM 'là' 'gì' \
        | 'quy_định' 'về' RULE_TERM 'là' 'gì' \
        | 'bài_tập_lớn' 'có' 'được' 'sử_dụng' 'công_cụ' AI_TERM 'không' \
        | 'bài_tập_lớn' 'có_thể' 'sử_dụng' RULE_TERM 'hoặc' RULE_TERM 'không' \
        | 'các' 'quy_định' 'của' 'môn_học' 'là' 'gì'

Q_RESOURCE -> 'tài_liệu' 'tham_khảo' 'về' RES_TOPIC 'là' 'gì' \
            | 'tài_liệu' 'nào' 'liên_quan' 'đến' RES_TOPIC \
            | 'tài_liệu' 'nào' TOPIC_VERB 'về' RES_TOPIC \
            | 'giáo_trình' 'của' 'môn_học' 'là' 'gì' \
            | 'tài_liệu' 'học_tập' 'của' 'môn_học' 'là' 'gì' \
            | 'tài_liệu' 'của' 'chương' CH_NUM 'là' 'gì'

# 6. HỎI CHUẨN ĐẦU RA (GET_LO)
Q_LO -> LO_CODE 'là' 'gì' \
    | LO_CODE 'học' 'về' 'gì' \
    | LO_CODE 'liên_quan' 'đến' 'nội_dung' 'nào' \
    | LO_CODE 'liên_quan' 'đến' 'nội_dung' 'gì' \
    | 'chuẩn_đầu_ra' LO_CODE 'là' 'gì' \
    | LO_CODE 'thuộc' 'chương' 'nào' \
    | 'môn_học' 'có' 'những' 'chuẩn_đầu_ra' 'nào'

# 7. CONTEXT_DEPENDENT - câu có đồng tham chiếu
Q_CONTEXT -> CTX_REF 'có' 'liên_quan' 'đến' TOPIC_ENTITY 'không' \
            | CTX_REF 'có' TOPIC_ENTITY 'không' \
            | 'còn' 'chương' CTX_DIR \
            | 'còn' 'chương' CTX_DIR 'thì' 'sao' \
            | CTX_REF 'cần' 'xuất' 'file' 'gì' \
            | CTX_REF 'cần' 'những' 'file' 'output' 'nào' \
            | 'tài_liệu' 'của' CTX_REF 'là' 'gì' \
            | 'tài_liệu' 'của' CTX_REF 'ở' 'đâu' \
            | CTX_REF 'nằm' 'ở' 'chương' 'nào' \
            | CTX_REF 'học' 'vào' 'tuần' 'nào'


